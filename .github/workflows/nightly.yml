name: Nightly

# 压力与资源测试不阻塞 PR：它们要生成几千个文件、几十 MB 的 diff，跑一次几十秒到几分钟。
# 放进 PR 门禁只会让人开始习惯性忽略红灯（见 docs/plans/2026-07-27-adversarial-test-hardening-plan.md
# Phase 7）。
on:
  schedule:
    - cron: '17 18 * * *' # 每天 02:17 (UTC+8)
  workflow_dispatch:

permissions:
  contents: read

# 与 ci.yml 同因：npm registry 的 read ETIMEDOUT 抖动。
env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '10000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
  NPM_CONFIG_FETCH_TIMEOUT: '600000'

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: action
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: action/package-lock.json
      - run: npm ci
      - name: Stress and resource-pressure suite
        run: npm run test:stress

  # 回归评测（Task 9.1-9.3）。这个 job 会真的调用 DeepSeek，会花钱，所以只走
  # nightly，且刻意**不**加 continue-on-error —— 召回率掉下去、误报涨上来、结果
  # 开始抖，都必须是红的。
  #
  # 没有配置 DEEPSEEK_API_KEY 时它会失败而不是跳过：一个悄悄跳过的评测 job 和
  # 没有评测是一回事，但前者会在 Actions 列表里显示成绿的。
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: action/package-lock.json
      # 评测把 action 的 TypeScript 源码现场打成 bundle 来跑（见
      # benchmarks/lib/pipeline.mjs），所以需要 action 的依赖，尤其是 esbuild。
      - name: Install action deps
        run: npm ci
        working-directory: action
      - name: Install benchmark deps
        run: npm ci
        working-directory: benchmarks
      - name: Benchmark harness unit tests
        run: npm test
        working-directory: benchmarks
      - name: Regression evaluation (gated)
        working-directory: benchmarks
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        # --repeat=3：Task 9.3 的抖动度量至少要两轮才有定义，三轮才能让
        # 「三次里坏一次」这种情况在配对均值里显出来。再往上加就是线性烧钱。
        run: node run-evaluation.mjs --gate --repeat=3
