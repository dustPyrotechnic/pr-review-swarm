name: TMP Eval #11 #12

# 临时：验证 #11/#12 夹具与 skill 修复。拿到数据后删除本文件。
# 走 pull_request 是因为 workflow_dispatch 需要当前 token 没有的权限。
on:
  pull_request

permissions:
  contents: read

env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '10000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
  NPM_CONFIG_FETCH_TIMEOUT: '600000'

jobs:
  eval-11-12:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: action/package-lock.json
      - name: Install action deps
        run: npm ci
        working-directory: action
      - name: Install benchmark deps
        run: npm ci
        working-directory: benchmarks
      - name: Evaluate #11/#12 cases
        working-directory: benchmarks
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          for case in swift-retain-cycle objc-retain-cycle-block historical-todo-in-touched-file; do
            echo "::group::${case}"
            node run-evaluation.mjs --case="${case}" --repeat=3
            echo "::endgroup::"
          done
