name: TMP Eval Full

# 临时 workflow：补齐 context 后重跑全量评测，为 thresholds.json 定可信基线。
# 配置与 nightly.yml 的 evaluation job 一致（--gate --repeat=3）。
# 拿到基线后立即删除。
on:
  pull_request:

permissions:
  contents: read

env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '10000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
  NPM_CONFIG_FETCH_TIMEOUT: '600000'

jobs:
  full-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: action/package-lock.json
      - name: Install action deps
        run: npm ci
        working-directory: action
      - name: Install benchmark deps
        run: npm ci
        working-directory: benchmarks
      - name: Full regression evaluation (gated)
        working-directory: benchmarks
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node run-evaluation.mjs --gate --repeat=3
