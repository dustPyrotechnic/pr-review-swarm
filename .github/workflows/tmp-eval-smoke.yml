name: TMP Eval Smoke

# 临时 workflow：只为在本 PR 上验证回归评测能真的跑通（key 可读、bundle 在 CI
# 能构建、真实 API 能通）。刻意只跑 1 个用例 × 2 轮，把首轮验证的花费压到最低。
#
# 合入前必须删除。真正的评测通道是 nightly.yml 的 evaluation job。
on:
  pull_request:

permissions:
  contents: read

env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '10000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
  NPM_CONFIG_FETCH_TIMEOUT: '600000'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: action/package-lock.json
      - name: Install action deps
        run: npm ci
        working-directory: action
      - name: Install benchmark deps
        run: npm ci
        working-directory: benchmarks
      - name: Evaluation smoke (1 case, 2 runs)
        working-directory: benchmarks
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node run-evaluation.mjs --case=go-missing-error-check --repeat=2
