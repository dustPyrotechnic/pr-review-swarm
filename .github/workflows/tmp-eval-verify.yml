name: TMP Eval Verify

# 临时 workflow：验证 #9 / #10 的修复在真实模型上确实把召回率救回来了。
# 单测只能证明「行号渲染正确」，证明不了「模型会照着用」——那必须真跑。
# 验证后立即删除。真正的评测通道是 nightly.yml 的 evaluation job。
on:
  pull_request:

permissions:
  contents: read

env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '10000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
  NPM_CONFIG_FETCH_TIMEOUT: '600000'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: action/package-lock.json
      - name: Install action deps
        run: npm ci
        working-directory: action
      - name: Install benchmark deps
        run: npm ci
        working-directory: benchmarks
      - name: Evaluation — 3 cases x 2 runs
        working-directory: benchmarks
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          for c in go-missing-error-check swift-retain-cycle historical-issue-not-introduced; do
            echo "::group::$c"
            node run-evaluation.mjs --case=$c --repeat=2
            echo "::endgroup::"
          done
